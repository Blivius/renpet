# git-cliff: drafts the next CHANGELOG.md section from conventional commits.
#   git cliff --unreleased --strip all      (brew install git-cliff, or npx git-cliff)
# Paste the draft under `## Unreleased` and edit it into short lines for someone installing the
# release. See RELEASING.md.

[changelog]
header = ""
body = """
{% for group in ["Features", "Fixes", "Performance"] %}\
{% set picked = commits | filter(attribute="group", value=group) %}\
{% if picked | length > 0 %}
### {{ group }}
{% for commit in picked %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endif %}\
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
filter_commits = true
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^(chore|ci|test|docs|style|refactor|build|release)", skip = true },
]
