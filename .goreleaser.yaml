# Releases: see RELEASING.md. A pushed v* tag runs .github/workflows/release.yml, which runs this.
version: 2

builds:
  - env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    files: [README.md, LICENSE*]

checksum:
  name_template: checksums.txt

# The release notes are this version's CHANGELOG.md section (scripts/changelog-section.sh),
# passed by the workflow with --release-notes. See RELEASING.md.
changelog:
  disable: true

release:
  extra_files:
    - glob: ./install.sh

# brew install blivius/tap/renpet (macOS; Homebrew casks don't install on Linux)
homebrew_casks:
  - name: renpet
    binaries: [renpet]
    description: "How much of your week was you vs your AI coding agents"
    homepage: https://github.com/blivius/renpet
    repository:
      owner: blivius
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    hooks:
      post:
        # the binary isn't notarized: without this, macOS refuses to open it
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/renpet"]
